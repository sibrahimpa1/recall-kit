[project]
name = "recall-kit"
version = "0.1.0"
description = "Persistent memory and project continuity for AI agents: markdown-first, git-versioned, hybrid-indexed, shared over MCP."
readme = "README.md"
license = "MIT"
authors = [{ name = "Senka Ibrahimpašić", email = "sibrahimpa1@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "cryptography>=43",
    "mcp>=1.9",
    "pyyaml>=6.0",
    "rich>=13.9",
    "typer>=0.15",
    "uvicorn>=0.32",
]

[project.optional-dependencies]
eval = ["anthropic>=0.70"]

[project.scripts]
rk = "recall_kit.cli:app"

[dependency-groups]
dev = [
    "icalendar>=6.0",
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
    "types-pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recall_kit"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "E501"]

[tool.mypy]
files = ["src"]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "continuity: cross-session scenario tests (fresh process per session)",
    "llm: needs ANTHROPIC_API_KEY; runs scenarios through a real Claude agent",
]
